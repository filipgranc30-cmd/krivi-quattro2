name: Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The legacy "tools" package was removed from the SDK. This action's
      # default is `sdkmanager tools`, which now exits with
      # "Failed to find package 'tools'". Ask only for platform-tools;
      # cmdline-tools are already on the GitHub runner.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build Capacitor WebView shell
        run: |
          rm -rf "$RUNNER_TEMP/kq-apk"
          mkdir -p "$RUNNER_TEMP/kq-apk/www"
          cd "$RUNNER_TEMP/kq-apk"
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap init "Krivi Quattro" hr.krivi.quattro --web-dir www
          cp "$GITHUB_WORKSPACE/public/logo.jpg" www/logo.jpg || true
          printf '%s\n' '<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krivi Quattro</title></head><body style="margin:0;background:#070708;color:#fff;font-family:sans-serif"><p style="padding:24px">Krivi Quattro se otvara…</p></body></html>' > www/index.html
          npx cap add android
          node << 'JS'
          const fs = require("fs");
          const server = { url: "https://krivi-quattro2.vercel.app", cleartext: false, androidScheme: "https" };
          if (fs.existsSync("capacitor.config.json")) {
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            config.server = server;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          }
          if (fs.existsSync("capacitor.config.ts")) {
            let text = fs.readFileSync("capacitor.config.ts", "utf8");
            if (!text.includes("server:")) {
              text = text.replace(/};\s*$/, `  server: { url: "https://krivi-quattro2.vercel.app", cleartext: false, androidScheme: "https" },\n};\n`);
              fs.writeFileSync("capacitor.config.ts", text);
            }
          }
          JS
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-out/"
      - uses: actions/upload-artifact@v4
        with:
          name: krivi-quattro-apk
          path: apk-out/*.apk
          if-no-files-found: error
