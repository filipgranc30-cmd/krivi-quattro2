name: Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The legacy "tools" package was removed from the SDK. This action's
      # default is `sdkmanager tools`, which now exits with
      # "Failed to find package 'tools'". Ask only for platform-tools;
      # cmdline-tools are already on the GitHub runner.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build signed release APK
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: krivi-quattro-apk
          path: public/krivi-quattro.apk
          if-no-files-found: error
